name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v0.1.0)'
        required: false
        type: string

# 同一分支/tag 的新推送会取消旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  #  macOS：release .app（重签名 + 随包 LibreDWG）+ DMG
  # ────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mirrors (npm + cargo TUNA sparse)
        run: |
          npm config set registry https://registry.npmmirror.com
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          EOF

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # dwg2dxf 是运行时依赖，不进 cargo；build_app.sh 会把它和 dylib 塞进 .app
      - name: Install LibreDWG + create-dmg
        run: brew install libredwg create-dmg

      - name: Install npm dependencies
        run: npm install

      - name: Build .app (re-signed, LibreDWG sidecar bundled)
        run: ./build_app.sh

      - name: Build DMG
        run: ./bundle_dmg.sh

      - name: Prepare release artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "$HOME/Downloads/Rocktier CAD Viewer.dmg" "Rocktier-CAD-Viewer_${VERSION}_aarch64.dmg"
          ls -lh "Rocktier-CAD-Viewer_${VERSION}_aarch64.dmg"

      - name: Upload artifact (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-CAD-Viewer-macos-aarch64
          path: Rocktier-CAD-Viewer_*_aarch64.dmg
          if-no-files-found: error

      - name: Prepare app.zip
        run: |
          APP="src-tauri/target/release/bundle/macos/Rocktier CAD Viewer.app"
          [ -d "$APP" ] || { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.CAD.Viewer.app.zip"

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            Rocktier-CAD-Viewer_*_aarch64.dmg
            Rocktier.CAD.Viewer.app.zip
          generate_release_notes: true

  # ────────────────────────────────────────────────────────────────
  #  Windows：MSI / NSIS 安装包 + MSIX（Microsoft Store）
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64 (MSI + MSIX)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mirrors (npm + cargo TUNA sparse)
        shell: pwsh
        run: |
          npm config set registry https://registry.npmmirror.com
          $dir = "$env:USERPROFILE\.cargo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          "@ | Out-File -FilePath "$dir\config.toml" -Encoding utf8

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # DWG 支持靠随包分发的 dwg2dxf.exe；这里下载官方 win64 发行包并复制到
      # src-tauri/resources/libredwg/，tauri.conf.json 已声明该目录为 bundle resources
      - name: Provision LibreDWG sidecar (dwg2dxf.exe)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/provision-libredwg-windows.ps1 -Download

      - name: Build MSI + NSIS installers
        run: npm run tauri build

      - name: Build MSIX (Microsoft Store)
        run: npm run tauri:windows:build

      - name: Upload artifacts (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-CAD-Viewer-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # ────────────────────────────────────────────────────────────────
  #  Checks：前端构建 + cargo test（与 build/release 解耦，push 即跑）
  #  tauri::generate_context! 编译期要读 dist/ 与图标，所以先出前端产物。
  # ────────────────────────────────────────────────────────────────
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend build (dist/ required by tauri::generate_context!)
        run: npm run build

      - name: Rust tests
        working-directory: ./src-tauri
        run: cargo test --all-targets

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.msix$ \.msixbundle$'
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
