name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v0.1.0)'
        required: false
        type: string

# crates.io 直连偶发超时，留重试余量
env:
  CARGO_NET_RETRY: 10

# 同一分支/tag 的新推送会取消旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  #  macOS：release .app（重签名 + 随包 LibreDWG）+ DMG
  # ────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            filearch: arm64
          - runner: macos-15-intel
            arch: x64
            filearch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Setup npm registry
        run: npm config set registry https://registry.npmmirror.com

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      # dwg2dxf 是运行时依赖，不进 cargo；build_app.sh 会把它和 dylib 塞进 .app
      - name: Install LibreDWG + create-dmg
        run: brew install libredwg create-dmg

      # Homebrew installs under /opt/homebrew on Apple Silicon and /usr/local on
      # Intel; build_app.sh cannot guess which prefix this runner uses.
      - name: Resolve LibreDWG prefix
        run: echo "LIBREDWG_DIR=$(brew --prefix libredwg)" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm install

      # Developer ID 证书可选：导入了就交给 build_app.sh 签 .app，DMG 随后公证；
      # 没导入就退回 ad-hoc（产物与改动前一致），并在 CI 打 notice。
      - name: Import Developer ID certificate (optional)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERT_P12:-}" ]; then
            keychain="$RUNNER_TEMP/rocktier-signing.keychain-db"
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$keychain"
            # 6 小时不锁：导入在本步，真正签名在 build_app.sh、公证在后面另一步，
            # 中间隔着几分钟的 tauri build，15 分钟不活动锁会把 codesign 卡住。
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" \
              | awk '/Developer ID Application/ {print $2; exit}')
            if [ -z "$identity" ]; then
              echo "::error::APPLE_CERT_P12 is set but contains no Developer ID Application identity."
              exit 1
            fi
            echo "signing as $identity"
            echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          else
            echo "::notice::No Developer ID certificate configured - ad-hoc signing. Downloaded copies will still be flagged by Gatekeeper."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build .app (re-signed, LibreDWG sidecar bundled)
        run: ./build_app.sh

      # 把公证失败提前到「构建后几秒」：等 notarytool 跑完 10 分钟才报
      # 「签名缺 secure timestamp」是最贵的失败方式。
      - name: Assert .app signature before packaging
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Rocktier CAD Viewer.app"
          codesign --verify --deep --strict "$APP"
          info=$(codesign -dv --verbose=4 "$APP" 2>&1 || true)
          if [ "${SIGN_IDENTITY:-}" = "-" ]; then
            echo "::notice::ad-hoc build: timestamp/authority assertions and spctl skipped (by design)."
          else
            case "$info" in *"Authority=Developer ID Application"*) ;; *)
              echo "::error::.app is missing Developer ID authority"; exit 1 ;; esac
            case "$info" in *"Timestamp="*) ;; *)
              echo "::error::.app has no secure timestamp - notarization would fail"; exit 1 ;; esac
          fi

      - name: Build DMG
        id: build_dmg
        # create-dmg 偶发失败（同 Write 的 bundle_dmg.sh flake），给一次重试
        continue-on-error: true
        env:
          # CI 不依赖 $HOME/Downloads：直接落到 bundle/dmg
          CAD_DMG_OUT: src-tauri/target/release/bundle/dmg/Rocktier CAD Viewer.dmg
        run: ./bundle_dmg.sh

      - name: Retry Build DMG (create-dmg flake)
        if: steps.build_dmg.outcome == 'failure'
        env:
          CAD_DMG_OUT: src-tauri/target/release/bundle/dmg/Rocktier CAD Viewer.dmg
        run: |
          set -uo pipefail
          # 清掉残留挂载与半成品，否则重试会撞在同一个残留上
          hdiutil info 2>/dev/null | awk '/\/Volumes\// {print $NF}' \
            | grep -i rocktier | while read -r m; do
                echo "detaching $m"; hdiutil detach "$m" -force || true
              done
          rm -f "src-tauri/target/release/bundle/dmg/Rocktier CAD Viewer.dmg" \
                "src-tauri/target/release/bundle/dmg/Rocktier_CAD_Viewer.tmp.dmg"
          ./bundle_dmg.sh

      # 公证的对象是整个 DMG；staple 把票据装回 DMG，离线也能验。
      # 没有证书时只做 ad-hoc 签名，产物与旧版一致（Gatekeeper 仍会拦）。
      - name: Sign + notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' ! -name '*.tmp.dmg' -print -quit)
          [ -n "$dmg" ] || { echo "::error::DMG not found in src-tauri/target/release/bundle/dmg"; exit 1; }
          case "${SIGN_IDENTITY:-}" in
            "-")
              codesign -s - -fv "$dmg"
              echo "::notice::DMG signed ad-hoc only - no notarization ticket; spctl skipped (by design)."
              ;;
            "")
              echo "::error::SIGN_IDENTITY is empty - certificate step did not export it; refusing to sign with a blank identity."
              exit 1
              ;;
            *)
              keychain="$RUNNER_TEMP/rocktier-signing.keychain-db"
              if [ -f "$keychain" ]; then security unlock-keychain -p "" "$keychain"; fi
              codesign -s "$SIGN_IDENTITY" --timestamp -fv "$dmg"
              xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"

              # 硬断言：DMG 必须是 Developer ID + secure timestamp（case 而非 grep，
              # 避免 pipefail 下 codesign 被 SIGPIPE 误判）
              info=$(codesign -dv --verbose=4 "$dmg" 2>&1 || true)
              case "$info" in *"Authority=Developer ID Application"*) ;; *)
                echo "::error::DMG signature is missing Developer ID authority"; exit 1 ;; esac
              case "$info" in *"Timestamp="*) ;; *)
                echo "::error::DMG signature has no secure timestamp"; exit 1 ;; esac
              # Gatekeeper 兜底：用户双击的就是这个 dmg，必须 accepted
              spctl -a -t open --context context:primary-signature -vv "$dmg" \
                || { echo "::error::Gatekeeper rejected the notarized DMG"; exit 1; }
              ;;
          esac
          codesign -dvvv "$dmg" 2>&1 | grep 'Signature=' || true

      - name: Prepare release artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' ! -name '*.tmp.dmg' -print -quit)
          [ -n "$dmg" ] || { echo "::error::DMG not found"; exit 1; }
          cp "$dmg" "Rocktier-CAD-Viewer_${VERSION}_${{ matrix.arch }}.dmg"
          ls -lh "Rocktier-CAD-Viewer_${VERSION}_${{ matrix.arch }}.dmg"

      - name: Upload artifact (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-CAD-Viewer-macos-${{ matrix.arch }}
          path: Rocktier-CAD-Viewer_*_${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Prepare app.zip
        run: |
          APP="src-tauri/target/release/bundle/macos/Rocktier CAD Viewer.app"
          [ -d "$APP" ] || { echo "::error::.app not found"; exit 1; }
          file "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q '${{ matrix.filearch }}'
          file "$APP/Contents/MacOS/dwg2dxf" | grep -q '${{ matrix.filearch }}'
          otool -L "$APP/Contents/MacOS/dwg2dxf" | grep -q '@loader_path/libredwg.0.dylib'
          "$APP/Contents/MacOS/dwg2dxf" --version >/dev/null
          ditto -c -k --keepParent "$APP" "Rocktier.CAD.Viewer_${{ matrix.arch }}.app.zip"

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            Rocktier-CAD-Viewer_*_${{ matrix.arch }}.dmg
            Rocktier.CAD.Viewer_${{ matrix.arch }}.app.zip
          generate_release_notes: true

  # ────────────────────────────────────────────────────────────────
  #  Windows：MSI / NSIS 安装包 + MSIX（Microsoft Store）
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64 (MSI + MSIX)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Setup npm registry
        shell: pwsh
        run: npm config set registry https://registry.npmmirror.com

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # DWG 支持靠随包分发的 dwg2dxf.exe；这里下载官方 win64 发行包并复制到
      # src-tauri/resources/libredwg/，tauri.conf.json 已声明该目录为 bundle resources
      - name: Provision LibreDWG sidecar (dwg2dxf.exe)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/provision-libredwg-windows.ps1 -Download

      - name: Build MSI + NSIS installers
        run: npm run tauri build

      - name: Build MSIX (Microsoft Store)
        # MSIX 直装走 direct 付费墙（微软商店渠道已弃用，2026-10-05 终裁 C3）。
        # 若未来恢复商店渠道：本步需加 env ROCKTIER_CHANNEL: store（10.8.2/10.8.4）。
        run: npm run tauri:windows:build

      # 去掉 MSI 文件名里的 _en-US（Tauri v2 按 bundle.windows.wix.language 追加）。
      # 应用带语言切换器，文件名宣称单一语言会误导：看起来像存在「英文版」与
      # 其他本地化安装包，而实际只有一个多语言安装包。
      # 只改文件名，不动 bundle 配置 —— WiX 的 language 是 MSI 构建必需的
      # 工具链语言码，改它会让构建失败。
      - name: Strip _en-US from MSI filename
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in src-tauri/target/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi
          ls -1 src-tauri/target/release/bundle/msi/*.msi

      - name: Upload artifacts (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-CAD-Viewer-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # ────────────────────────────────────────────────────────────────
  #  Checks：前端构建 + cargo test（与 build/release 解耦，push 即跑）
  #  tauri::generate_context! 编译期要读 dist/ 与图标，所以先出前端产物。
  # ────────────────────────────────────────────────────────────────
  checks:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # `sync:legal` 必须在这里显式跑，**不能只依赖 beforeBuildCommand**。
      #
      # `beforeBuildCommand` 只在 `tauri build` 路径上触发（见 tauri.conf.json：
      # `npm run sync:legal && npm run build`）。而本 job 走的是
      # `npm run build` + `cargo test`，**绕过 beforeBuildCommand** ——
      # 于是 `src-tauri/resources/legal/` 是空的（那些文件被 .gitignore 排除，
      # 由 sync-legal.mjs 从仓库根复制而来）。
      #
      # 下一行 `cargo test` 编译 `tauri::generate_context!` 时会读
      # `bundle.resources` 里的 `resources/legal/*`，glob 匹配不到任何文件就
      # 直接失败 —— 报的是 build.rs 的 exit code 101，与 clippy 无关，
      # 很容易被误判成编译错误。实测本地完整复现：
      #   清空 legal/ → `glob pattern resources/legal/* path not found` → exit 101
      #   npm run sync:legal → 编译通过
      - name: Sync licence resources (build.rs needs resources/legal/*)
        run: npm run sync:legal

      - name: Frontend build (dist/ required by tauri::generate_context!)
        run: npm run build

      - name: Rust tests
        working-directory: ./src-tauri
        run: cargo test --all-targets

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '_aarch64\.dmg$ _x64\.dmg$ _aarch64\.app\.zip$ _x64\.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
# 这个 job **必须 checkout**，否则下面的 gh 命令无法工作。
      # 没有 actions/checkout 就没有 git remote，而 gh 靠 git remote 推断
      # 当前仓库 —— 于是每条 gh 命令报
      #   `failed to run git: fatal: not a git repository`
      # 并以非 0 退出。
      #
      # 本 job 只需要读/改 Release 状态、不需要源码，但**为了让 gh 认出
      # 仓库，仍必须 checkout**（build job 都有，只有这里漏了）。
      #
      # 实测踩过：MD v1.0.8 / CAD v0.2.6 / Journal v0.2.8 三仓发版全红，
      # 报错是「六个包全缺」，而资产其实早已上传完毕 —— 真因是这里缺
      # checkout，此前被校验段里的 `2>/dev/null || true` 掩盖着；
      # 去掉那个 `2>/dev/null` 之后它才浮出来。
      #
      # 另一条思路是给每条 gh 命令加 `--repo ${{ github.repository }}`。
      # 选 checkout 是因为它一次解决全部 gh 子命令（view/edit/upload），
      # 而 `--repo` 漏写一处就又坏。
      - uses: actions/checkout@v4
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            # 保留 || true 仅为让轮询能继续重试（资产 API 确实会 lag），
            # 但**必须把 stderr 打出来** —— 之前 `2>/dev/null` 把它一并丢掉，
            # 于是 gh 的真实错误（权限 / 仓库名 / Rate limit）被伪装成
            # 「资产还没上传」，报错信息完全指错方向，排查方向整个跑偏。
            # 实测踩过：MD v1.0.7 / CAD v0.2.5 / Journal v0.2.7 三个仓资产其实齐全，
            # 校验却报「六个包全缺」—— 就是这一行。修复沿用 Write 仓的写法。
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
