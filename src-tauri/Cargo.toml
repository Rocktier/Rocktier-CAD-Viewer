[package]
name = "rocktier-cad-viewer"
version = "0.1.0"
description = "Fast, private CAD viewer. No internet needed."
authors = ["Rocktier"]
edition = "2021"
default-run = "rocktier-cad-viewer"

[lib]
name = "rocktier_cad_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "test_e2e"
path = "src/bin/test_e2e.rs"
required-features = ["e2e-test"]

[features]
e2e-test = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DXF files exported from Chinese AutoCAD are usually ANSI/GBK, not UTF-8.
encoding_rs = "0.8"
tauri-plugin-single-instance = "2.4.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
